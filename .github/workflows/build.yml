name: Build and distribute app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PLATFORM: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:content
      - run: npx tsc --noEmit
      - run: node scripts/check-release.mjs
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing. Add an Expo access token in VerseType > Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed install files on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform "$PLATFORM" --profile release --non-interactive --wait --json > builds.json
      - name: Download install files
        run: |
          mkdir -p artifacts
          jq -e 'length > 0 and all(.[]; .status == "FINISHED" and .distribution == "INTERNAL" and (.platform == "ANDROID") and (.artifacts.buildUrl | startswith("https://")))' builds.json
          jq -r '.[] | [.platform, .id, .artifacts.buildUrl] | @tsv' builds.json > builds.tsv
          while IFS=$'\t' read -r platform id url; do
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' "$url" -o "artifacts/$platform-$id.apk"
            printf '%s | %s | %s\n' "$platform" "$id" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          done < builds.tsv
          printf 'Commit: %s\n' "$GITHUB_SHA" > artifacts/BUILD.txt
          jq -r '.[] | [.platform, .id] | @tsv' builds.json >> artifacts/BUILD.txt
          cd artifacts
          shopt -s nullglob
          files=(*.apk)
          sha256sum "${files[@]}" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: install-files
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: install-files
          path: artifacts
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Android: APK를 내려받아 설치하세요.
          iOS 배포는 현재 일시 중지되어 있습니다.
          BUILD.txt에서 소스 커밋과 EAS 빌드 ID, SHA256SUMS에서 파일 해시를 확인할 수 있습니다.
          NOTES
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "$RELEASE_TAG" --notes-file notes.md
